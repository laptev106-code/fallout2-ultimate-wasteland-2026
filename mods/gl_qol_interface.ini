; ====================================================================
; Fallout 2: Ultimate Wasteland Edition 2026
; Quality of Life Interface Enhancements Configuration
; Script: gl_qol_interface.int
; ====================================================================

[Settings]
; Close inventory or container (loot) screen by clicking anywhere
; outside the window frame onto the game background.
; NOTE: Barter (Shop), Dialogue, and Combat are strictly excluded to protect
; mouse quantity selection, price calculation, and trade confirmation!
; 1 = Enabled (Recommended), 0 = Disabled
ClickOutsideClosesInventory=1

; Expand the clickable "Done" / "ГОТОВО" button hit-box in inventory to include
; the entire text plate, not just the tiny red button.
; 1 = Enabled (Recommended), 0 = Disabled
ExpandedDoneButtonArea=1

; Automatically close container/loot screen when all items have been taken
; (e.g. after clicking "Take All" / "Забрать все" or pressing 'D').
; 1 = Enabled (Recommended), 0 = Disabled
AutoCloseEmptyContainers=1

; Auto-close container when pressing the 'D' (Take All) hotkey.
; 1 = Enabled, 0 = Disabled
CloseOnTakeAllKey=1

; Pressing Spacebar in non-combat mode initiates Combat Mode ('A' key / Attack).
; In combat mode, Spacebar continues to function natively as End Turn.
; 1 = Enabled, 0 = Disabled
SpacebarEntersCombat=1
