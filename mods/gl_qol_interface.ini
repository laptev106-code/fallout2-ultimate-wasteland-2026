; Quality of Life Interface Enhancements Configuration
; Script: gl_qol_interface.int
; ====================================================================

[Settings]
; Close inventory, container (loot), or barter screen by clicking anywhere
; outside the window frame onto the game background.
; 1 = Enabled (Recommended), 0 = Disabled
ClickOutsideClosesInventory=1

; Expand the clickable "Done" / "ГОТОВО" button hit-box to include the entire
; text plate, not just the tiny red button.
; 1 = Enabled (Recommended), 0 = Disabled
ExpandedDoneButtonArea=1

; Automatically close container/loot screen when all items have been taken
; (e.g. after looting all items or pressing 'D' / Take All).
; 1 = Enabled, 0 = Disabled (Default: 0, allows examining empty container or depositing items)
AutoCloseEmptyContainers=0

; Auto-close container when pressing the 'D' (Take All) hotkey.
; 1 = Enabled, 0 = Disabled
CloseOnTakeAllKey=1
