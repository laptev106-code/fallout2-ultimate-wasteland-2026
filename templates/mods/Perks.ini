[Traits]
Enable=1
Traits_plus_version=1.2ru
[t0]
Desc=Ваш обмен веществ настолько ускорен, что раны и переломы заживают прямо на глазах! Однако из-за быстрого деления клеток вы уязвимы для ядов и радиации, а химикаты действуют вдвое меньше, зато лучше лечат и выводят токсины.
Traits_plus_desc_is_set=1
StatMod=14|4
[t1]
Desc=Пожертвовать скоростью ради физической мощи. Вы бьёте редко, но так, что все заметят! Ваши ОД снижены, зато Сила и Здоровье увеличены, а атаки в ближнем бою и метательным оружием (кроме гранат) наносят вдвое больше урона.
Traits_plus_desc_is_set=1
StatMod=7|10
[t2]
Desc=Возможно, вы несколько уступаете по комплекции своим собратьям, но это никогда вас не останавливало. Много снаряжения вам не унести, зато вы превосходите других в ловкости и скрытности, к тому же в вас сложнее попасть.
Traits_plus_desc_is_set=1
[t3]
Desc=Одной рукой вы владеете лучше, чем двумя. Все одноручные атаки точнее на 20%, получают +5 к силе критического удара и остаются доступными при травме рук. Однако двуручное оружие имеет штраф -40% к меткости.
Traits_plus_desc_is_set=1
[t4]
Desc=Вы жертвуете уроном ради точности. Обычные атаки слабее на 30%, но вы получаете +10% к меткости, шансу и силе критического удара, а избыточный шанс попадания усиливает критические атаки.
Traits_plus_desc_is_set=1
StatMod=16|10
[t5]
Desc=Вы безрассудно рвётесь в бой, не раздумывая ни секунды. Ловкость не даёт вам защиты, и каждый ваш шаг снижает меткость, зато атаки после движения требуют меньше очков действия.
Traits_plus_desc_is_set=1
StatMod=13|5
[t6]
Desc=Вы бьёте сильнее, а не точнее. Ваши атаки ближнего боя и метательным оружием (кроме гранат) наносят больше урона, могут сбить с ног и пробивают часть защиты врага. Но ваши критические удары всегда слабее.
Traits_plus_desc_is_set=1
[t8]
Desc=Странная ирония судьбы: критические промахи становятся опаснее для всех, и каждый гибнет самой жестокой смертью. Но не всё так плохо! Вы получаете немного ОД за убийства и причинение травм.
Traits_plus_desc_is_set=1
[t9]
Desc=Хорошая новость: у всех вокруг вас во время боя снижается максимальный шанс попадания на 5%, и каждый промах с 50% вероятностью может стать критическим. Плохая новость: у вас тоже!
Traits_plus_desc_is_set=1
[t11]
Desc=Вы намного легче привыкаете к химикатам. Они действуют на 50% сильнее и могут навсегда усилить вас. Шансы пристраститься к наркотикам в два раза выше, но вы быстрее оправляетесь от зависимостей.
Traits_plus_desc_is_set=1
[t12]
Desc=Вы устойчивы к химии: Выносливость выше, а химикаты не вызывают негативных последствий и зависимости, поэтому вы можете принимать больше доз. Но сила и длительность эффектов химикатов, кроме лечебных и очищающих, уменьшены вдвое.
Traits_plus_desc_is_set=1
StatMod=2|1
[t14]
Desc=Вы оттачиваете свои навыки. Максимальный шанс попадания +4%, критические промахи реже и слабее, +5 очков навыков за уровень. Требования к уровню способностей снижены на 4, но сами способности даются раз в 4 уровня.
Traits_plus_desc_is_set=1
