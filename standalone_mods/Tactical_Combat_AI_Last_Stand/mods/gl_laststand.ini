[Settings]
; Distance (in hexes) at which wounded armed enemies stop fleeing and resume firing.
; Default: 12 (standard medium combat range)
KitingDistance=12

; Base percentage chance (0 to 100) for a critically wounded enemy (HP <= 22%)
; to trigger a desperate "Last Stand" counter-attack instead of fleeing.
; Tough combatants with ST >= 7 or EN >= 7 receive +2% to +4% bonus chance.
; Default: 8 (Recommended: 5 - 15)
LastStandBaseChance=8

; Fearless brutes: Super Mutants, Combat Robots, Deathclaws, and Aliens NEVER flee in panic.
; 1 = Enabled (Lore-friendly & Tactical), 0 = Disabled (Vanilla behavior)
; Default: 1
FearlessBrutes=1

; Floating red combat shouts when Last Stand is triggered.
; 1 = Enabled (Shows authentic desperate battle cries), 0 = Disabled
; Default: 1
FloatCombatMessages=1
