; ==============================================================================
; WASTELAND VOICES (ЖИВЫЕ ГОЛОСА ПУСТОШИ) v1.0.0
; Конфигурационный файл автономного нарративного мода
; ==============================================================================

[General]
; Главный переключатель мода (1 - включен, 0 - полностью отключен)
EnableMod=1

; Минимальный интервал между фоновыми репликами над головой в секундах реального времени
; Рекомендуемое значение: 60-120 сек (защита от забивания экрана текстом)
MinCooldownSeconds=90

; Базовый шанс срабатывания реплики при наступлении события в процентах (1-100)
; Рекомендуемое значение: 20-30%
RNGChance=20

; Выводить информационное сообщение в окно лога Pip-Boy при первой загрузке (1 - да, 0 - нет)
ShowInitMessage=1

[Modules]
; КОНТУР 1: Базовые города и спутники оригинального Fallout 2 + RPU
; Включает реакции Сулика, Кэссиди, Вика, Маркуса, Гориса на Кламат, Ден, Волт-Сити и др.
EnableCoreRPU=1

; КОНТУР 2: Расширенные локации и спутницы нашей сборки
; Включает реакции на Аббатство (The Abbey), EPA, Деревню дикарей, Бункер 21,
; а также реплики боевой Мирии, Сери, Лары и боевые выкрики при балансе EcCo.
EnableExtendedMods=1

[Reactivity]
; Реакция прохожих и дикарей на силовую броню (T-51b / Advanced Power Armor)
ReactToPowerArmor=1

; Реакция охраны и шерифов на обнаженные тяжелые стволы (миниганы, огнеметы, базуки)
ReactToHeavyWeapons=1

; Реакция толпы в городах людей на спутников-мутантов (Маркус) и гулей (Ленни)
ReactToCompanions=1

; Особые насмешливые или снисходительные реплики прохожих при интеллекте Избранного < 4
ReactToLowIQ=1
