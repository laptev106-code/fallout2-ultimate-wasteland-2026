; [ТЕСТИРУЕТСЯ] Dynamic Theft & Witness System
; Статус модуля: ТЕСТИРУЕТСЯ (Экспериментальная геймплейная механика 2026)
[General]
; Show tactical tension status on container examine (1 = On, 0 = Off)
EnableExamineStatus=1

; Master toggle for Dynamic Theft & Witness System (1 = Enabled, 0 = Disabled)
Enabled=1
; Verbose debug log in console (0 = Off, 1 = On)
DebugLog=0

[Detection]
; Detection scan radius in hexes around container/pocket (default: 10)
ScanRadius=10
; Base warning timer (seconds) before suspect escalates if player lingers near container
BaseWarningTimer=4
; Memory timer for suspicious containers in minutes (default: 5)
MemoryDurationMinutes=5
; Minimum distance in hexes the player must retreat to freeze escalation (default: 2)
SafeRetreatDistance=2

[EquipmentAndNoise]
; Armor noise penalty: Metal Armor detection penalty (default: 15)
MetalArmorPenalty=15
; Power Armor detection penalty (default: 30)
PowerArmorPenalty=30
; Active Stealth Boy stealth detection bonus (default: 40)
StealthBoyBonus=40
; Advanced lockpick sets noise reduction bonus (default: 15)
LockpickToolsBonus=15

[Roleplay]
; Charisma bonus modifier: extra seconds per Charisma level above 6 (default: 1)
CharismaTimeBonus=1
; Charisma penalty modifier: seconds deducted per Charisma level below 4 (default: 1)
CharismaTimePenalty=1
; Luck saving throw enabled (1 = Yes, 0 = No)
LuckSaveEnabled=1
; Minimum Luck required to trigger Luck saving throw (default: 6)
LuckThreshold=6
; Sex Appeal check for opposite sex NPCs (1 = Yes, 0 = No)
SexAppealBonus=1

[Immunity]
; Ignore child NPCs as valid witnesses (1 = Yes, 0 = No)
IgnoreChildren=1
; Ignore slave NPCs as valid witnesses (1 = Yes, 0 = No)
IgnoreSlaves=1
; Ignore drug addict NPCs as valid witnesses (1 = Yes, 0 = No)
IgnoreAddicts=1
