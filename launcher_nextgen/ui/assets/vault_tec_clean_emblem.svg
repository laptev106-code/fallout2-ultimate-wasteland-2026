<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#cab340" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g fill="#cab340" filter="url(#goldGlow)">
    <!-- Central core -->
    <circle cx="50" cy="50" r="14" />
    
    <!-- 3 Vault-Tec blades at 0, 120, 240 degrees -->
    <!-- Blade 1 (Top-Right / 90 deg offset) -->
    <path d="M 50,18 A 32,32 0 0,1 77.7,34 L 89.2,27.3 A 45,45 0 0,0 50,5 Z" />
    <!-- Blade 2 (Bottom-Right) -->
    <path d="M 77.7,66 A 32,32 0 0,1 50,82 L 50,95 A 45,45 0 0,0 89.2,72.7 Z" />
    <!-- Blade 3 (Left) -->
    <path d="M 22.3,50 A 32,32 0 0,1 36.1,26 L 24.6,19.3 A 45,45 0 0,0 5,50 Z" />

    <!-- Secondary inner orbiting arc segments -->
    <path d="M 50,26 A 24,24 0 0,1 70.8,38 L 65.6,41 A 18,18 0 0,0 50,32 Z" />
    <path d="M 70.8,62 A 24,24 0 0,1 50,74 L 50,68 A 18,18 0 0,0 65.6,59 Z" />
    <path d="M 29.2,50 A 24,24 0 0,1 39.6,32 L 34.4,29 A 18,18 0 0,0 29.2,50 Z" />
  </g>
</svg>